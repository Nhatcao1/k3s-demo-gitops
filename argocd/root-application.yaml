apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Keep the existing resource name during migration so the installed root
  # Application updates in place instead of creating a second root controller.
  name: counter-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@gitlab.com:nhatcao99uetwork/k3s-demo-gitops.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
