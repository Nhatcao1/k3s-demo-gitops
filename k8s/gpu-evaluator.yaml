apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${HE_GPU_DEPLOYMENT}
  namespace: ${HE_NAMESPACE}
spec:
  replicas: 1
  # The target node has one allocatable GPU. A rolling update would keep the
  # old Pod on that GPU while the replacement waits forever for the same GPU.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: ${HE_GPU_DEPLOYMENT}
  template:
    metadata:
      labels:
        app: ${HE_GPU_DEPLOYMENT}
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: hht-k8s-staging-22
      tolerations:
        - key: dedicated
          operator: Equal
          value: T4
          effect: NoSchedule
      containers:
        - name: ${HE_GPU_DEPLOYMENT}
          image: ${HE_GPU_IMAGE}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: ${HE_SERVICE_PORT}
          env:
            - name: MAX_ARTIFACT_BYTES
              value: "268435456"
            - name: MAX_REQUEST_BYTES
              value: "805306368"
            - name: HE_GPU_WORKER_TIMEOUT_SECONDS
              value: "600"
            - name: HE_GPU_DEMO_TIMEOUT_SECONDS
              value: "3600"
          resources:
            requests:
              cpu: "${HE_GPU_REQUEST_CPU}"
              memory: ${HE_GPU_REQUEST_MEMORY}
              nvidia.com/gpu: "${HE_GPU_COUNT}"
            limits:
              cpu: "${HE_GPU_LIMIT_CPU}"
              memory: ${HE_GPU_LIMIT_MEMORY}
              nvidia.com/gpu: "${HE_GPU_COUNT}"
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ${HE_GPU_SERVICE}
  namespace: ${HE_NAMESPACE}
spec:
  selector:
    app: ${HE_GPU_DEPLOYMENT}
  ports:
    - name: http
      port: ${HE_SERVICE_PORT}
      targetPort: http
