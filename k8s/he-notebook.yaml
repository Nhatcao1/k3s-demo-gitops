apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${HE_NOTEBOOK_PVC}
  namespace: ${HE_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${HE_NOTEBOOK_STORAGE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${HE_NOTEBOOK_DEPLOYMENT}
  namespace: ${HE_NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${HE_NOTEBOOK_DEPLOYMENT}
  template:
    metadata:
      labels:
        app: ${HE_NOTEBOOK_DEPLOYMENT}
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: ${HE_NOTEBOOK_GPU_NODE_NAME}
      tolerations:
        - key: dedicated
          operator: Equal
          value: ${HE_NOTEBOOK_GPU_TAINT_VALUE}
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: seed-playground
          image: ${HE_NOTEBOOK_IMAGE}
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
          args:
            - |
              cp /seed/he_playground.ipynb /workspace/he_playground.latest.ipynb
              if [ ! -e /workspace/he_playground.ipynb ]; then
                cp /seed/he_playground.ipynb /workspace/he_playground.ipynb
              fi
          volumeMounts:
            - name: notebook-seed
              mountPath: /seed
              readOnly: true
            - name: workspace
              mountPath: /workspace
      containers:
        - name: jupyterlab
          image: ${HE_NOTEBOOK_IMAGE}
          imagePullPolicy: Always
          workingDir: /workspace
          command:
            - /bin/sh
            - -ec
          args:
            - |
              # This is the runtime acceptance boundary. GitLab compiled the
              # CUDA image without a GPU; the T4 Pod must prove a real SDK
              # encrypt/square/decrypt before JupyterLab is exposed. Any
              # CUDA/FIDES failure terminates the container with no CPU fallback.
              python -c 'import math; from he_sdk import HESession; he = HESession.create(backend="fides"); observed = he.decrypt(he.square(he.encrypt([2.0]))); he.close(); assert math.isclose(float(observed[0]), 4.0, rel_tol=1e-3, abs_tol=1e-3), observed; print("GPU_NOTEBOOK_PREFLIGHT=PASS", flush=True)'
              exec python -m jupyterlab \
                --no-browser \
                --ip=0.0.0.0 \
                --port=${HE_NOTEBOOK_PORT} \
                --ServerApp.root_dir=/workspace \
                --ServerApp.allow_remote_access=True \
                --IdentityProvider.token="$JUPYTER_TOKEN"
          env:
            - name: HE_NOTEBOOK_BACKEND
              value: fides
            - name: HE_GPU_DEVICE
              value: "0"
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${HE_NOTEBOOK_SECRET}
                  key: token
          ports:
            - name: http
              containerPort: ${HE_NOTEBOOK_PORT}
          resources:
            requests:
              cpu: "${HE_NOTEBOOK_REQUEST_CPU}"
              memory: ${HE_NOTEBOOK_REQUEST_MEMORY}
              nvidia.com/gpu: "${HE_NOTEBOOK_GPU_COUNT}"
            limits:
              cpu: "${HE_NOTEBOOK_LIMIT_CPU}"
              memory: ${HE_NOTEBOOK_LIMIT_MEMORY}
              nvidia.com/gpu: "${HE_NOTEBOOK_GPU_COUNT}"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: notebook-seed
          configMap:
            name: ${HE_NOTEBOOK_CONFIGMAP}
        - name: workspace
          persistentVolumeClaim:
            claimName: ${HE_NOTEBOOK_PVC}
---
apiVersion: v1
kind: Service
metadata:
  name: ${HE_NOTEBOOK_SERVICE}
  namespace: ${HE_NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app: ${HE_NOTEBOOK_DEPLOYMENT}
  ports:
    - name: http
      port: ${HE_NOTEBOOK_PORT}
      targetPort: http
