apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${HE_NOTEBOOK_PVC}
  namespace: ${HE_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${HE_NOTEBOOK_STORAGE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${HE_NOTEBOOK_DEPLOYMENT}
  namespace: ${HE_NAMESPACE}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${HE_NOTEBOOK_DEPLOYMENT}
  template:
    metadata:
      labels:
        app: ${HE_NOTEBOOK_DEPLOYMENT}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: seed-playground
          image: ${HE_NOTEBOOK_IMAGE}
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
          args:
            - |
              cp /seed/he_playground.ipynb /workspace/he_playground.latest.ipynb
              if [ ! -e /workspace/he_playground.ipynb ]; then
                cp /seed/he_playground.ipynb /workspace/he_playground.ipynb
              fi
          volumeMounts:
            - name: notebook-seed
              mountPath: /seed
              readOnly: true
            - name: workspace
              mountPath: /workspace
      containers:
        - name: jupyterlab
          image: ${HE_NOTEBOOK_IMAGE}
          imagePullPolicy: Always
          workingDir: /workspace
          command:
            - /bin/sh
            - -ec
          args:
            - |
              exec python -m jupyterlab \
                --no-browser \
                --ip=0.0.0.0 \
                --port=${HE_NOTEBOOK_PORT} \
                --ServerApp.root_dir=/workspace \
                --ServerApp.allow_remote_access=True \
                --IdentityProvider.token="$JUPYTER_TOKEN"
          env:
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ${HE_NOTEBOOK_SECRET}
                  key: token
          ports:
            - name: http
              containerPort: ${HE_NOTEBOOK_PORT}
          resources:
            requests:
              cpu: "${HE_NOTEBOOK_REQUEST_CPU}"
              memory: ${HE_NOTEBOOK_REQUEST_MEMORY}
            limits:
              cpu: "${HE_NOTEBOOK_LIMIT_CPU}"
              memory: ${HE_NOTEBOOK_LIMIT_MEMORY}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: notebook-seed
          configMap:
            name: ${HE_NOTEBOOK_CONFIGMAP}
        - name: workspace
          persistentVolumeClaim:
            claimName: ${HE_NOTEBOOK_PVC}
---
apiVersion: v1
kind: Service
metadata:
  name: ${HE_NOTEBOOK_SERVICE}
  namespace: ${HE_NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app: ${HE_NOTEBOOK_DEPLOYMENT}
  ports:
    - name: http
      port: ${HE_NOTEBOOK_PORT}
      targetPort: http
