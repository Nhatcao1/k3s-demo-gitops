apiVersion: batch/v1
kind: Job
metadata:
  name: ${HE_COMPARE_JOB_NAME}
  namespace: ${HE_NAMESPACE}
  labels:
    app: he-operation-comparison
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: ${HE_COMPARE_JOB_TTL_SECONDS}
  activeDeadlineSeconds: ${HE_COMPARE_JOB_TIMEOUT_SECONDS}
  template:
    metadata:
      labels:
        app: he-operation-comparison
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: comparison-client
          image: ${HE_COMPARE_CLIENT_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import gzip
              import os
              from pathlib import Path
              import subprocess
              import sys

              for name in ("data_profiles.py", "compare_operations.py"):
                  source = Path("/benchmark") / f"{name}.gz"
                  target = Path("/tmp") / name
                  with gzip.open(source, "rb") as compressed:
                      target.write_bytes(compressed.read())
              arguments = Path("/benchmark/arguments.txt").read_text(
                  encoding="utf-8"
              ).splitlines()
              command = [
                  sys.executable,
                  "/tmp/compare_operations.py",
                  "--cpu-url",
                  os.environ["HE_COMPARE_CPU_URL"],
                  "--gpu-url",
                  os.environ["HE_COMPARE_GPU_URL"],
                  "--data-dir",
                  "/benchmark-data",
                  *arguments,
              ]
              raise SystemExit(subprocess.run(command, check=False).returncode)
          env:
            - name: HE_COMPARE_CPU_URL
              value: ${HE_COMPARE_CPU_URL}
            - name: HE_COMPARE_GPU_URL
              value: ${HE_COMPARE_GPU_URL}
          resources:
            requests:
              cpu: "${HE_COMPARE_REQUEST_CPU}"
              memory: ${HE_COMPARE_REQUEST_MEMORY}
            limits:
              cpu: "${HE_COMPARE_LIMIT_CPU}"
              memory: ${HE_COMPARE_LIMIT_MEMORY}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: benchmark-code
              mountPath: /benchmark
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
            - name: benchmark-data
              mountPath: /benchmark-data
              readOnly: true
      volumes:
        - name: benchmark-code
          configMap:
            name: he-operation-comparison-code
        - name: temporary-files
          emptyDir:
            sizeLimit: ${HE_COMPARE_TMP_STORAGE}
        - name: benchmark-data
          persistentVolumeClaim:
            claimName: ${HE_COMPARE_DATA_PVC}
