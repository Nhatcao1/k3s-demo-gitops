apiVersion: batch/v1
kind: Job
metadata:
  name: ${HE_COMPARE_DATA_JOB_NAME}
  namespace: ${HE_NAMESPACE}
  labels:
    app: he-comparison-data
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: ${HE_COMPARE_DATA_JOB_TIMEOUT_SECONDS}
  template:
    metadata:
      labels:
        app: he-comparison-data
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: data-generator
          image: ${HE_COMPARE_DATA_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import gzip
              from pathlib import Path
              import subprocess
              import sys

              for name in ("data_profiles.py", "generate_data.py"):
                  source = Path("/generator") / f"{name}.gz"
                  target = Path("/tmp") / name
                  with gzip.open(source, "rb") as compressed:
                      target.write_bytes(compressed.read())
              arguments = Path("/generator/arguments.txt").read_text(
                  encoding="utf-8"
              ).splitlines()
              command = [
                  sys.executable,
                  "/tmp/generate_data.py",
                  "--output-dir",
                  "/benchmark-data",
                  *arguments,
              ]
              raise SystemExit(subprocess.run(command, check=False).returncode)
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: generator-code
              mountPath: /generator
              readOnly: true
            - name: benchmark-data
              mountPath: /benchmark-data
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: generator-code
          configMap:
            name: he-comparison-data-code
        - name: benchmark-data
          persistentVolumeClaim:
            claimName: ${HE_COMPARE_DATA_PVC}
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
