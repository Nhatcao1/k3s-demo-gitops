apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${HE_POSTGRES_PVC}
  namespace: ${HE_NAMESPACE}
  labels:
    app.kubernetes.io/name: ${HE_POSTGRES_STATEFULSET}
    app.kubernetes.io/part-of: he-sdk-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${HE_POSTGRES_STORAGE}
---
apiVersion: v1
kind: Service
metadata:
  name: ${HE_POSTGRES_SERVICE}
  namespace: ${HE_NAMESPACE}
  labels:
    app.kubernetes.io/name: ${HE_POSTGRES_STATEFULSET}
    app.kubernetes.io/part-of: he-sdk-storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ${HE_POSTGRES_STATEFULSET}
  ports:
    - name: postgres
      port: ${HE_POSTGRES_PORT}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${HE_POSTGRES_STATEFULSET}
  namespace: ${HE_NAMESPACE}
  labels:
    app.kubernetes.io/name: ${HE_POSTGRES_STATEFULSET}
    app.kubernetes.io/part-of: he-sdk-storage
spec:
  serviceName: ${HE_POSTGRES_SERVICE}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${HE_POSTGRES_STATEFULSET}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${HE_POSTGRES_STATEFULSET}
        app.kubernetes.io/part-of: he-sdk-storage
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: ${HE_POSTGRES_IMAGE}
          imagePullPolicy: Always
          args:
            - -c
            - listen_addresses=*
          ports:
            - name: postgres
              containerPort: ${HE_POSTGRES_PORT}
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ${HE_POSTGRES_SECRET}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${HE_POSTGRES_SECRET}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${HE_POSTGRES_SECRET}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "${HE_POSTGRES_REQUEST_CPU}"
              memory: ${HE_POSTGRES_REQUEST_MEMORY}
            limits:
              cpu: "${HE_POSTGRES_LIMIT_CPU}"
              memory: ${HE_POSTGRES_LIMIT_MEMORY}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/001_he_store.sql
              subPath: 001_he_store.sql
              readOnly: true
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: ${HE_POSTGRES_PVC}
        - name: schema
          configMap:
            name: ${HE_POSTGRES_SCHEMA_CONFIGMAP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${HE_POSTGRES_STATEFULSET}
  namespace: ${HE_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: he-sdk-storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ${HE_POSTGRES_STATEFULSET}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: ${HE_POSTGRES_PORT}
