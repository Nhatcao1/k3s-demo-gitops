apiVersion: v1
kind: Service
metadata:
  name: cpu-postgres-demo
  namespace: ${DEMO_NAMESPACE}
  labels:
    app.kubernetes.io/name: cpu-postgres-demo-db
    app.kubernetes.io/part-of: cpu-postgres-demo
spec:
  selector:
    app.kubernetes.io/name: cpu-postgres-demo-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cpu-postgres-demo
  namespace: ${DEMO_NAMESPACE}
  labels:
    app.kubernetes.io/name: cpu-postgres-demo-db
    app.kubernetes.io/part-of: cpu-postgres-demo
spec:
  serviceName: cpu-postgres-demo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-postgres-demo-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpu-postgres-demo-db
        app.kubernetes.io/part-of: cpu-postgres-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: ${DEMO_POSTGRES_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cpu-postgres-demo-db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cpu-postgres-demo-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cpu-postgres-demo-db
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: database
        labels:
          app.kubernetes.io/part-of: cpu-postgres-demo
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: ${DEMO_POSTGRES_STORAGE}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cpu-postgres-demo-db
  namespace: ${DEMO_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: cpu-postgres-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cpu-postgres-demo-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: cpu-postgres-demo
      ports:
        - protocol: TCP
          port: 5432
