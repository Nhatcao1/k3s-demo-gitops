apiVersion: batch/v1
kind: Job
metadata:
  generateName: he-salary-verify-sum-
  namespace: ${DEMO_NAMESPACE}
  labels:
    app.kubernetes.io/name: he-salary-verify-sum
    app.kubernetes.io/part-of: cpu-postgres-demo
    he.demo/stage: verify-sum
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: he-salary-verify-sum
        app.kubernetes.io/part-of: cpu-postgres-demo
        he.demo/stage: verify-sum
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${DEMO_NODE_NAME}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: trusted-sum-verifier
          image: ${DEMO_HE_IMAGE}
          imagePullPolicy: Always
          command: [python, -m, cpu_postgres_demo.cli]
          args: [verify-sum]
          envFrom:
            - configMapRef:
                name: cpu-postgres-demo-config
            - secretRef:
                name: cpu-postgres-demo-db
            - secretRef:
                name: cpu-postgres-demo-input
            - secretRef:
                name: cpu-postgres-demo-key
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: demo-input
              mountPath: /input
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: demo-input
          secret:
            secretName: cpu-postgres-demo-input
        - name: temporary-files
          emptyDir:
            sizeLimit: 512Mi
