apiVersion: v1
kind: ConfigMap
metadata:
  name: cpu-postgres-demo-schema
  namespace: ${DEMO_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: cpu-postgres-demo
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS he_demo_sessions (
      session_id varchar(128) PRIMARY KEY,
      scheme varchar(4) NOT NULL CHECK (scheme IN ('ckks', 'bgv')),
      status varchar(16) NOT NULL CHECK (
        status IN ('INITIALIZED', 'SUMMED', 'MULTIPLIED', 'VERIFIED')
      ),
      valid_count integer NOT NULL CHECK (valid_count BETWEEN 1 AND 8192),
      kpi_scale integer NOT NULL CHECK (kpi_scale > 0),
      created_at timestamptz NOT NULL DEFAULT now(),
      updated_at timestamptz NOT NULL DEFAULT now()
    );

    ALTER TABLE he_demo_sessions
      ADD COLUMN IF NOT EXISTS scheme varchar(4) NOT NULL DEFAULT 'ckks';
    ALTER TABLE he_demo_sessions
      ADD COLUMN IF NOT EXISTS kpi_scale integer NOT NULL DEFAULT 10;

    CREATE TABLE IF NOT EXISTS he_demo_results (
      session_id varchar(128) PRIMARY KEY REFERENCES he_demo_sessions(session_id)
        ON DELETE CASCADE,
      expected_amount numeric NOT NULL,
      decrypted_amount numeric,
      absolute_error numeric CHECK (absolute_error >= 0),
      updated_at timestamptz NOT NULL DEFAULT now()
    );

    DO $$
    BEGIN
      IF EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public'
          AND table_name = 'he_demo_sessions'
          AND column_name = 'expected_amount'
      ) THEN
        EXECUTE 'INSERT INTO he_demo_results
          (session_id, expected_amount, decrypted_amount, absolute_error)
          SELECT session_id, expected_amount, decrypted_amount, absolute_error
          FROM he_demo_sessions WHERE expected_amount IS NOT NULL
          ON CONFLICT (session_id) DO NOTHING';
        ALTER TABLE he_demo_sessions
          DROP COLUMN IF EXISTS expected_amount,
          DROP COLUMN IF EXISTS decrypted_amount,
          DROP COLUMN IF EXISTS absolute_error;
      END IF;
    END
    $$;

    CREATE TABLE IF NOT EXISTS he_demo_artifacts (
      session_id varchar(128) NOT NULL REFERENCES he_demo_sessions(session_id)
        ON DELETE CASCADE,
      artifact_name varchar(64) NOT NULL CHECK (
        artifact_name IN (
          'crypto_context',
          'salary_ciphertext',
          'kpi_ciphertext',
          'sum_evaluation_keys',
          'multiplication_evaluation_keys',
          'wrapped_secret_key',
          'sum_ciphertext',
          'kpi_result_ciphertext'
        )
      ),
      payload bytea NOT NULL CHECK (octet_length(payload) > 0),
      sha256 char(64) NOT NULL CHECK (sha256 ~ '^[0-9a-f]{64}$'),
      created_at timestamptz NOT NULL DEFAULT now(),
      PRIMARY KEY (session_id, artifact_name)
    );

    CREATE TABLE IF NOT EXISTS he_demo_operations (
      operation_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      session_id varchar(128) NOT NULL REFERENCES he_demo_sessions(session_id)
        ON DELETE CASCADE,
      operation varchar(16) NOT NULL CHECK (
        operation IN ('initialize', 'sum', 'multiply', 'verify')
      ),
      outcome varchar(16) NOT NULL CHECK (outcome IN ('COMPLETED')),
      completed_at timestamptz NOT NULL DEFAULT now(),
      UNIQUE (session_id, operation)
    );

    REVOKE ALL ON he_demo_artifacts FROM PUBLIC;
    REVOKE ALL ON he_demo_results FROM PUBLIC;
    REVOKE ALL ON he_demo_sessions FROM PUBLIC;
    REVOKE ALL ON he_demo_operations FROM PUBLIC;
