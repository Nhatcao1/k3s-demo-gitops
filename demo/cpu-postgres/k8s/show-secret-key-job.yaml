apiVersion: batch/v1
kind: Job
metadata:
  generateName: he-show-secret-key-
  namespace: ${DEMO_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: cpu-postgres-demo
    he.demo/stage: show-secret-key
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cpu-postgres-demo
        he.demo/stage: show-secret-key
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${DEMO_NODE_NAME}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: trusted-key-viewer
          image: ${DEMO_HE_IMAGE}
          imagePullPolicy: Always
          command: [python, -m, cpu_postgres_demo.cli]
          args: [show-secret-key, --unsafe]
          envFrom:
            - configMapRef:
                name: cpu-postgres-demo-config
            - secretRef:
                name: cpu-postgres-demo-db
            - secretRef:
                name: cpu-postgres-demo-key
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
