apiVersion: batch/v1
kind: Job
metadata:
  generateName: cpu-postgres-schema-
  namespace: ${DEMO_NAMESPACE}
  labels:
    app.kubernetes.io/name: cpu-postgres-demo-schema
    app.kubernetes.io/part-of: cpu-postgres-demo
    he.demo/stage: schema
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpu-postgres-demo-schema
        app.kubernetes.io/part-of: cpu-postgres-demo
        he.demo/stage: schema
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${DEMO_NODE_NAME}
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: schema
          image: ${DEMO_POSTGRES_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" \
                -U "$PGUSER" -d "$PGDATABASE"; do
                sleep 2
              done
              exec psql --set=ON_ERROR_STOP=1 --file=/schema/schema.sql
          envFrom:
            - configMapRef:
                name: cpu-postgres-demo-config
            - secretRef:
                name: cpu-postgres-demo-db
          env:
            - name: PGHOST
              value: cpu-postgres-demo
            - name: PGPORT
              value: "5432"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: cpu-postgres-demo-schema
