apiVersion: batch/v1
kind: Job
metadata:
  generateName: he-salary-sum-
  namespace: ${DEMO_NAMESPACE}
  labels:
    app.kubernetes.io/name: he-salary-sum
    app.kubernetes.io/part-of: cpu-postgres-demo
    he.demo/stage: sum
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: he-salary-sum
        app.kubernetes.io/part-of: cpu-postgres-demo
        he.demo/stage: sum
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: secretless-sum-evaluator
          image: ${DEMO_HE_IMAGE}
          imagePullPolicy: Always
          command:
            - python
            - -m
            - cpu_postgres_demo.cli
          args:
            - sum
          envFrom:
            - configMapRef:
                name: cpu-postgres-demo-config
            - secretRef:
                name: cpu-postgres-demo-db
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 512Mi
