# Example shape only. Do not apply this file with real data in source control.
# README.md creates both Secrets explicitly with kubectl.
apiVersion: v1
kind: Secret
metadata:
  name: cpu-postgres-demo-db
  namespace: he-dev
type: Opaque
stringData:
  POSTGRES_DB: he_demo
  POSTGRES_USER: he_demo
  POSTGRES_PASSWORD: replace-me
  PGDATABASE: he_demo
  PGUSER: he_demo
  PGPASSWORD: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: cpu-postgres-demo-input
  namespace: he-dev
type: Opaque
stringData:
  DEMO_SALARIES_JSON: "[1200,1800,2400,3000]"
  DEMO_KPI: "0.8"
  # Must be replaced by: openssl rand -base64 32
  DEMO_KEY_WRAP_KEY: replace-with-base64-of-32-random-bytes
