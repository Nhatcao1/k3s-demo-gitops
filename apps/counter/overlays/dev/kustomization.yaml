apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: counter-dev

resources:
  - ../../base

images:
  - name: registry.gitlab.com/nhatcao99uetwork/k3s-demo-app/api
    newTag: 49367a5c
  - name: registry.gitlab.com/nhatcao99uetwork/k3s-demo-app/web
    newTag: 49367a5c

patches:
  - target:
      kind: ConfigMap
      name: counter-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: development
  - target:
      kind: Ingress
      name: counter
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: counter-dev.k3s.test
