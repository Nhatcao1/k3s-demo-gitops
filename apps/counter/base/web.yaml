apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-web
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: counter-web
  template:
    metadata:
      labels:
        app: counter-web
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: web
          image: registry.gitlab.com/uet-group1950631/k3s-demo-app/web:bootstrap
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: counter-web
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: counter-web
  ports:
    - name: http
      port: 80
      targetPort: http
