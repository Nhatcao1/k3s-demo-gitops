apiVersion: batch/v1
kind: Job
metadata:
  generateName: counter-smoke-test-
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: curlimages/curl:8.14.1
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              echo "Checking API health..."
              curl --fail --silent --show-error \
                http://counter-api:8080/health
              echo
              echo "Checking visit endpoint..."
              curl --fail --silent --show-error \
                http://counter-api:8080/api/visit
              echo
